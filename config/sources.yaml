sources:
  - id: hasil
    name: HASiL (Inland Revenue Board)
    url: https://www.hasil.gov.my/en/
    checks:
      - id: hasil-media-statements
        section: Home > Kenyataan Media (Media Statements)
        discover:
          from: https://www.hasil.gov.my/en/
          link_text: [Media Statement, Media Statements, Kenyataan Media]
          url_hint: https://www.hasil.gov.my/en/media-statement/
      - id: hasil-announcements
        section: Home > Pengumuman (Announcements)
        discover:
          from: https://www.hasil.gov.my/en/
          link_text: [Announcement, Announcements, Pengumuman]
          url_hint: https://www.hasil.gov.my/en/announcement/
      - id: hasil-e-invoice
        section: Pautan Popular > E-Invois
        discover:
          from: https://www.hasil.gov.my/en/
          link_text: [e-Invoice, E-Invois, e-Invois]
          url_hint: https://www.hasil.gov.my/en/e-invoice/
      - id: hasil-myinvois-epos
        section: Pautan Popular > MyInvois e-POS
        discover:
          from: https://www.hasil.gov.my/en/
          link_text: [MyInvois e-POS, e-POS]
          url_hint: https://www.hasil.gov.my/en/e-invoice/myinvois-e-pos/
      - id: hasil-return-form-filing-programme
        section: Forms > Return Form Filing Programme
        discover:
          from: https://www.hasil.gov.my/en/
          link_text: [Return Form Filing Programme, Program Memfail Borang Nyata]
          url_hint: https://www.hasil.gov.my/en/forms/return-form-filing-programme/
      - id: hasil-download-forms
        section: Forms > Download Forms (form years listed)
        mode: forms
        discover:
          from: https://www.hasil.gov.my/en/
          link_text: [Download Forms, Muat Turun Borang]
          url_hint: https://www.hasil.gov.my/en/forms/download-forms/
        crawl:
          path_prefix: /en/forms/download-forms/
          max_pages: 40
      - id: hasil-legislation
        section: Legislation (everything)
        discover:
          from: https://www.hasil.gov.my/en/
          link_text: [Legislation, Perundangan]
          url_hint: https://www.hasil.gov.my/en/legislation/
        crawl:
          path_prefix: /en/legislation/
          max_pages: 60
      - id: hasil-transfer-pricing
        section: Transfer Pricing
        discover:
          from: https://www.hasil.gov.my/en/
          link_text: [Transfer Pricing, Pindahan Harga]
          url_hint: https://www.hasil.gov.my/en/international/transfer-pricing/
        crawl:
          path_prefix: /en/international/transfer-pricing/
          max_pages: 20

