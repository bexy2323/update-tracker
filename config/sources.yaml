# Websites to check, taken from "Websites to Check.xlsx".
#
# Each source has one or more checks. A check is one page whose content is
# snapshotted and compared with the previous visit.
#
# Check fields:
#   id             unique id, used as the snapshot file name
#   section        the subcategory from the Excel listing
#   url            page to visit. If omitted, the page is found through `discover`.
#   discover       find the page by link text on another page:
#                    from:      page to search
#                    link_text: candidate link texts (first match wins, case-insensitive)
#                    url_hint:  fallback URL if no link matches
#   crawl          also snapshot pages linked from this one (one level deep):
#                    path_prefix: only follow links whose URL path starts with this
#                    max_pages:   safety cap
#   mode           links (default): track the list of links/items on the page
#                  forms: track which years are listed for each form
#   keywords       name of a keyword list below. New items not matching it are left
#                  out of the report (but are still saved in the snapshot).
#   requires_login true: never fetched automatically; listed in every report as
#                  needing a manual sign-in check.
#   ignore         regexes; matching text lines are ignored (visitor counters, clocks).
#   images         CSS selector for images to track, for announcements shown only as
#                  pictures (e.g. a banner slider).

